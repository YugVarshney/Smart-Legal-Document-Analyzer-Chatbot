<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"></html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Doc Bot</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    color: #2c3e50;
    margin-bottom: 30px;
  }
  form {
    background: white;
    padding: 25px 30px;
    margin: 15px 0;
    border-radius: 8px;
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
    width: 350px;
  }
  label {
    font-weight: 600;
    display: block;
    margin-bottom: 12px;
    color: #34495e;
  }
  input[type="file"] {
    width: 100%;
    margin-bottom: 18px;
    cursor: pointer;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 20px;
    border: 1.8px solid #ddd;
    border-radius: 5px;
    font-size: 14px;
  }
  button {
    width: 100%;
    background-color: #007bff;
    color: white;
    font-weight: 600;
    padding: 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #0056b3;
  }
  .form-title {
    text-align: center;
    margin-bottom: 18px;
    color: #1a237e;
  }
</style>
</head>
<body>

<h1>Smart Doc Bot</h1>

<form method="post" action="/upload-image" enctype="multipart/form-data">
  <div class="form-title">Upload Image to Extract Text</div>
  <label for="imageFile">Select Image</label>
  <input type="file" id="imageFile" name="file" accept="image/*" required />
  <button type="submit">Upload & Extract Text</button>
</form>

<form method="post" action="/upload-pdf" enctype="multipart/form-data">
  <div class="form-title">Upload PDF & Ask Question</div>
  <label for="pdfFile">Select PDF</label>
  <input type="file" id="pdfFile" name="file" accept=".pdf" required />
  <label for="query">Your Question about PDF</label>
  <input type="text" id="query" name="query" placeholder="Ask something about the PDF" required />
  <button type="submit">Ask PDF</button>
</form>

</body>
</html>
